name: Build & Release

# هنگام push تگ نسخه (مثل v1.0.0) به‌صورت خودکار exe ساخته و Release می‌شود
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and aria2 (external downloaders)
        run: choco install ffmpeg aria2 -y --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build portable EXE (PyInstaller)
        run: pyinstaller Persian_Youtube_Downloader.spec --noconfirm
        env:
          PYTHONIOENCODING: utf-8

      - name: Zip the portable folder
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $name = "Persian_Youtube_Downloader-v$tag-windows-x64"
          Compress-Archive -Path "dist/Persian_Youtube_Downloader/*" -DestinationPath "$name.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Persian_Youtube_Downloader-*.zip
          generate_release_notes: true
